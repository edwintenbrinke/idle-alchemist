version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: idle-alchemist-backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - idle-alchemist

  nginx:
    image: nginx:alpine
    container_name: idle-alchemist-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - idle-alchemist

  postgres:
    image: postgres:16
    container_name: idle-alchemist-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: idle_alchemist
      POSTGRES_USER: idle
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - idle-alchemist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idle -d idle_alchemist"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: idle-alchemist-redis
    ports:
      - "6379:6379"
    networks:
      - idle-alchemist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: idle-alchemist-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8100:8100"
    command: ionic serve --host=0.0.0.0 --port=8100
    networks:
      - idle-alchemist
    depends_on:
      - nginx

networks:
  idle-alchemist:
    driver: bridge

volumes:
  pgdata: